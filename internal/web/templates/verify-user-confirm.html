<!DOCTYPE html>
<html lang="{{ .lang }}">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
        <title>SwayRider - {{ call .sw_i18n "verify_user_confirm" }}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
        <style>
            body { font-family: 'Roboto', sans-serif; }
        </style>
    </head>
    <body>
        <main>
            <div class="container mt-5">
                <div class="row justify-content-center">
                    <div class="col-md-6 text-center">
                        <h1 class="mb-4">SwayRider</h1>
                        <h2 class="mb-3">{{ call .sw_i18n "verify_user_confirm" }}</h2>
                        <p class="mb-4">{{ call .sw_i18n "verify_user_confirm_description" }}</p>

                        <form method="POST" id="verify-user-form">
                            <input type="hidden" name="u" value="{{ .u }}">
                            <input type="hidden" name="t" value="{{ .t }}">
                            <noscript>
                                <button type="submit" class="btn btn-primary w-100">{{ call .sw_i18n "verify_user_confirm_submit" }}</button>
                            </noscript>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script>document.getElementById("verify-user-form").submit();</script>
    </body>
</html>
